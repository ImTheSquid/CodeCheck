[package]
name = "neural"
version = "0.1.0"
edition = "2021"

[features]
default = ["train"]
train = []

[dependencies]
syntree = "0.17.5"
util = { path = "../util" }
ast = { path = "../ast" }
itertools = "0.13.0"
walkdir = "2.5.0"
thiserror = "1.0.64"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
clap = { version = "4.5.20", features = ["derive"] }
ndarray = "0.16.1"
num_cpus = "1.16.0"
hdbscan = "0.9.0"
pyo3 = { version = "0.25.1", features = ["nightly", "auto-initialize"] }
numpy = "0.25.0"
rayon = "1.10.0"
ndarray-npy = "0.9.1"
rand = "0.9.2"
pythonize = "0.25.0"
